name: Generate 100% Code Map

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Generates a full structural map with signatures and dependency graphs
      - name: Build Code Map
        run: |
          npx repomix --style xml --output REPO_MAP.xml --remove-empty-lines

      - name: Commit Map back to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPO_MAP.xml
          git diff --staged --quiet || (git commit -m "chore: update 100% code map" && git push)