name: Generate 100% Code Map

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Generates a full structural map with signatures and dependency graphs
      - name: Build Code Map
        run: |
          mkdir -p out
          npx -y repomix --style xml --output out/REPO_MAP.xml --remove-empty-lines --ignore "dependencies/**,build/**,models/**,out/**"

      - name: Push to repomap branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repomap
          publish_dir: ./out
          force_orphan: true