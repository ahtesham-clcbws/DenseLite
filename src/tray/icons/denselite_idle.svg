<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Minimalist outer bounding frame -->
  <rect width="64" height="64" rx="14" fill="#0D1117"/>
  
  <!-- "Dense": Compact 3x3 quantized weight lattice / SIMD register grid -->
  <circle cx="20" cy="20" r="3" fill="#6E7681"/>
  <circle cx="32" cy="20" r="3" fill="#6E7681"/>
  <circle cx="20" cy="32" r="3" fill="#6E7681"/>
  <circle cx="32" cy="32" r="3" fill="#6E7681"/>
  <circle cx="20" cy="44" r="3" fill="#6E7681"/>
  <circle cx="32" cy="44" r="3" fill="#6E7681"/>
  
  <!-- "Lite": Clean vector arrow emerging from the dense matrix (AVX2 zero-overhead throughput) -->
